<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportEx OTC | Institutional Broker Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #151a21;
            --bg-card-hover: #1c232d;
            --border-color: #262d37;
            --accent-green: #0ecb81;
            --accent-green-glow: rgba(14, 203, 129, 0.15);
            --accent-red: #f6465d;
            --accent-gold: #f0b90b;
            --text-main: #eaecef;
            --text-muted: #848e9c;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        /* Горно мени / Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-badge {
            background: var(--accent-green-glow);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-family: 'JetBrains Mono', monospace;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
        
        .desk-info {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .desk-info span { color: var(--text-main); font-weight: 600; }

        /* Навигациски јазичиња */
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--accent-green-glow);
            color: var(--accent-green);
            border-color: var(--accent-green);
        }

        /* Главна мрежа со картички */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: #3a4454;
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .asset-title { font-size: 16px; font-weight: 600; }
        
        .token-code {
            background: #202630;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent-green);
            font-weight: 600;
        }

        .spot-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }

        .otc-box {
            background: #0f1318;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin: 14px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .otc-row {
            display: flex;
            justify-content: space-between;
        }

        .pool-indicator {
            color: var(--accent-green);
            border-top: 1px dashed var(--border-color);
            padding-top: 6px;
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
        }

        .deal-btn {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .deal-btn:hover { opacity: 0.9; }

        /* Професионален модал прозорец */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-content label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 16px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        .modal-content input:focus, .modal-content select:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-confirm {
            background-color: var(--accent-green) !important;
            color: #000 !important;
        }

        .btn-cancel {
            background-color: #2b313a !important;
            color: var(--text-main) !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-section">
            <div class="logo-badge">SPORTEX OTC</div>
            <div>
                <h1>Institutional Broker Terminal</h1>
                <div style="font-size: 12px; color: var(--text-muted);">Secure Liquidity Execution Desk</div>
            </div>
        </div>
        <div class="desk-info">
            <div>Оператор: <span>DESK-07</span></div>
            <div>Статус: <span style="color: var(--accent-green);">● ЛИЦЕНЦИРАНО</span></div>
        </div>
    </header>

    <div class="nav-tabs" id="categoryTabs">
        <button class="tab-btn active" onclick="switchCategory('football')">Фудбал</button>
        <button class="tab-btn" onclick="switchCategory('basketball')">Кошарка</button>
        <button class="tab-btn" onclick="switchCategory('nfl')">НФЛ</button>
        <button class="tab-btn" onclick="switchCategory('nhl')">НХЛ</button>

    <!-- Модал за Договор -->
    <div class="modal" id="dealModal">
        <div class="modal-content">
            <h3>Институционален OTC Договор</h3>
            
            <label>Тип на трансакција:</label>
            <select id="dealType" onchange="updateModalPricing()">
                <option value="BUY">КУПУВАЊЕ ОТC (BUY од Пул)</option>
                <option value="SELL">ПРОДАЖБА ОТC (SELL во Пул)</option>
            </select>

            <label>Актив / Код на Токен:</label>
            <input type="text" id="modalAsset" readonly>
            
            <label>Тековна Spot Цена:</label>
            <input type="text" id="modalSpotPrice" readonly>

            <label>Ликвиден Пул (Достапни токени):</label>
            <input type="text" id="modalPool" readonly>

            <label>Количина за извршување (Токени):</label>
            <input type="number" id="modalAmount" value="10000" min="100" oninput="updateModalPricing()">

            <label>Финална OTC Цена по токен (со пазарна маржа):</label>
            <input type="text" id="modalPrice" readonly style="color:var(--accent-green); font-weight:bold;">

            <label>Наш Treasury USDT Wallet:</label>
            <input type="text" id="ourWallet" value="0xSportExTreasury123456789ABCDEF">

            <label>Клиентски Паричник (Client Payout/Sender):</label>
            <input type="text" id="clientWallet" placeholder="Внеси валет адреса...">

            <div class="modal-actions">
                <button class="deal-btn btn-confirm" onclick="signAndDownloadDeal()">Потпиши и Симни Договор</button>
                <button class="deal-btn btn-cancel" onclick="closeModal()">Откажи</button>
            </div>
        </div>
    </div>

        let currentCat = 'football';
        let selectedAssetObj = null;
        let activeCharts = {};

        function renderAssets() {
            const grid = document.getElementById('assetsGrid');
            grid.innerHTML = '';
            
            marketData[currentCat].forEach((item, index) => {
                let spread = item.liquidity === "High" ? 15.00 : 25.00;
                let otcBuy = (item.price - spread).toFixed(2);
                let otcSell = (item.price + (spread * 0.8)).toFixed(2);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="asset-title">${item.name}</div>
                            <span class="token-code">${item.code}</span>
                        </div>
                        <div class="spot-price">${item.price.toFixed(2)} USDT</div>
                    </div>
                    <canvas id="chart-${index}" height="65"></canvas>
                    <div class="otc-box">
                        <div class="otc-row">
                            <span style="color:var(--text-muted)">OTC Bid (Купување):</span>
                            <span style="color:var(--accent-green); font-weight:600;">${otcBuy}</span>
                        </div>
                        <div class="otc-row">
                            <span style="color:var(--text-muted)">OTC Ask (Продажба):</span>
                            <span style="color:var(--accent-red); font-weight:600;">${otcSell}</span>
                        </div>
                        <div class="pool-indicator">
                            <span>Ликвиден Пул:</span>
                            <strong>${item.pool.toLocaleString()} ${item.code}</strong>
                        </div>
                    </div>
                    <button class="deal-btn" onclick="openDealModal('${item.code}')">Креирај Договор</button>
                `;
                grid.appendChild(card);

                setTimeout(() => {
                    const ctx = document.getElementById(`chart-${index}`).getContext('2d');
                    if(activeCharts[index]) activeCharts[index].destroy();
                    activeCharts[index] = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['', '', '', '', ''],
                            datasets: [{
                                data: [item.price-2, item.price+1, item.price-0.5, item.price+1.2, item.price],
                                borderColor: '#0ecb81',
                                borderWidth: 1.5,
                                pointRadius: 0,
                                tension: 0.3,
                                fill: true,
                                backgroundColor: 'rgba(14, 203, 129, 0.05)'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: { x: { display: false }, y: { display: false } }
                        }
                    });
                }, 50);
            });
        }

        function switchCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderAssets();
        }

        function openDealModal(code) {
            selectedAssetObj = null;
            for(let cat in marketData) {
                let found = marketData[cat].find(i => i.code === code);
                if(found) { selectedAssetObj = found; break; }
            }
            if(!selectedAssetObj) return;

            document.getElementById('modalAsset').value = `${selectedAssetObj.name} [${selectedAssetObj.code}]`;
            document.getElementById('modalSpotPrice').value = selectedAssetObj.price.toFixed(2) + " USDT";
            document.getElementById('modalPool').value = selectedAssetObj.pool.toLocaleString() + " токени";
            document.getElementById('dealType').value = "BUY";
            document.getElementById('dealModal').style.display = 'flex';
            
            updateModalPricing();
        }

        function updateModalPricing() {
            if(!selectedAssetObj) return;
            const dealType = document.getElementById('dealType').value;
            const amount = parseInt(document.getElementById('modalAmount').value) || 0;
            
            let spread = selectedAssetObj.liquidity === "High" ? 15.00 : 25.00;
            let slippage = (amount / 100000) * 2.5; 

            let finalOtcPrice = dealType === 'BUY' 
                ? (selectedAssetObj.price - spread - slippage) 
                : (selectedAssetObj.price + (spread * 0.8) + slippage);

            if(finalOtcPrice < 1) finalOtcPrice = 1.00;

            document.getElementById('modalPrice').value = finalOtcPrice.toFixed(2) + " USDT";
        }

        function closeModal() {
            document.getElementById('dealModal').style.display = 'none';
        }

        function signAndDownloadDeal() {
            const dealType = document.getElementById('dealType').value;
            const amount = parseInt(document.getElementById('modalAmount').value) || 0;
            const ourW = document.getElementById('ourWallet').value;
            const clientW = document.getElementById('clientWallet').value;
            
            if(!clientW) {
                alert("Ве молиме внесете валидна клиентска адреса!");
                return;
            }

            if(dealType === 'BUY' && amount > selectedAssetObj.pool) {
                alert("Грешка: Нема доволно токени во ликвидниот пул за оваа количина!");
                return;
            }

            let oldPool = selectedAssetObj.pool;
            if(dealType === 'BUY') {
                selectedAssetObj.pool -= amount;
                selectedAssetObj.price += (amount / 500000);

                selectedAssetObj.price -= (amount / 500000);
